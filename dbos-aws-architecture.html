<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBOS on AWS: from enqueue to execution</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>DBOS on AWS: from enqueue to execution</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dbos-aws-title dbos-aws-desc">
        <title id="dbos-aws-title">DBOS on AWS: from enqueue to execution</title>
        <desc id="dbos-aws-desc">The FastAPI API on EC2 (dbosclient, port 8000) exposes the GET|POST /workflows endpoint: it receives a workflow name, talks to DBOS via dbosclient — enqueuing into main_queue on RDS (Postgres 18.1) and querying status and results — and wakes the Lambda workers with an async, payload-less invoke; the workers process tasks from the queue.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ARROWS (drawn before nodes) ============ -->

        <!-- API ↔ RDS: dbosclient enqueue · get status/results -->
        <line x1="264" y1="280" x2="380" y2="280"
              stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

        <!-- RDS ↔ Lambda: dequeue tasks · run workflows -->
        <line x1="580" y1="280" x2="696" y2="280"
              stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

        <!-- API → Lambda: async Event invoke, wake-up ONLY (no payload, no data flow) -->
        <path d="M 164,228 V 216 Q 164,208 172,208 H 788 Q 796,208 796,216 V 244"
              fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"
              marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels (masked, 8px gap from their stroke) -->
        <rect x="280" y="260" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">ENQUEUE·STATUS</text>

        <rect x="600" y="260" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="638" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">DEQUEUE·EXEC</text>

        <rect x="438" y="188" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="197" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">INVOKE (EVENT)</text>

        <!-- Callout: editorial aside, top margin -->
        <text x="920" y="96" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif"
              text-anchor="end">only wakes the worker — no data in the payload</text>
        <path d="M 696,104 Q 688,154 700,204" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="700" cy="205" r="2" fill="#2d3142"/>

        <!-- ============ NODES ============ -->

        <!-- EC2 · API FastAPI (input) -->
        <rect x="64" y="228" width="200" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="228" width="200" height="104" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="72" y="234" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="88" y="243" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              font-weight="500" text-anchor="middle" letter-spacing="0.08em">EC2</text>
        <text x="164" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">API · FastAPI</text>
        <text x="164" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">dbosclient · :8000</text>
        <rect x="112" y="300" width="104" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="164" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">GET|POST /workflows</text>

        <!-- RDS · Postgres 18.1 (focal) -->
        <rect x="380" y="228" width="200" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="228" width="200" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="388" y="234" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="404" y="243" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              font-weight="500" text-anchor="middle" letter-spacing="0.08em">RDS</text>
        <text x="480" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Postgres 18.1</text>
        <text x="480" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">system database</text>
        <rect x="444" y="300" width="72" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="480" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">main_queue</text>

        <!-- Lambda · Workers (backend) -->
        <rect x="696" y="244" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="244" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="250" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="732" y="259" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              font-weight="500" text-anchor="middle" letter-spacing="0.08em">LAMBDA</text>
        <text x="796" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif"
              text-anchor="middle">Workers</text>
        <text x="796" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle">worker.py</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <line x1="40" y1="560" x2="64" y2="560" stroke="#4f5d75" stroke-width="1.2"
              marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
        <text x="76" y="563" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.06em">QUEUE · DBOS CLIENT</text>

        <rect x="240" y="552" width="20" height="20" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="268" y="563" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.06em">FOCUS · SYSTEM DB</text>

        <line x1="460" y1="560" x2="484" y2="560" stroke="#bf4520" stroke-width="1" stroke-dasharray="5,4"
              marker-end="url(#arrow-accent)"/>
        <text x="492" y="563" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              letter-spacing="0.06em">WAKE-UP ONLY · NO DATA</text>
      </svg>
    </div>
  </div>
</body>
</html>
