[project]
name = "dbos-study-python"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "boto3~=1.43",
    "dbos~=3.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Makes `pytest tests/` work from the `python/` dir without `python -m`.
pythonpath = ["."]

[tool.ruff.lint]
# The glue code intentionally catches broad exceptions (Floci/SDK quirks).
select = ["E", "F", "I"]
