name: ci

on:
  push:
  pull_request:

# The two stacks are fully independent (own RDS, Lambda, EC2, Terraform
# state). The go job runs only after the python job passed AND destroyed its
# stack, so even on a shared runner/Floci the Go E2E can never see Python
# resources. Discovery is also name-scoped (tag dbos-client-go, RDS
# dbos-go-db) rather than port-based.
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Check lockfile
        working-directory: python
        run: uv lock --check

      - name: Lint (ruff)
        run: uvx ruff check python/

      # E2E: the Python stack (RDS + Lambda + EC2) is emulated by Floci, the
      # same way it runs locally. Terraform provisions it, pytest drives it.
      - name: Start Floci (AWS emulator)
        run: docker compose up -d

      - name: Wait for Floci
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' floci 2>/dev/null)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Floci did not become healthy in 120s" && exit 1

      # The EC2 catalog AMI maps to this public image (Amazon ECR Public — not
      # a Docker Hub mirror, so the runners' shared-IP rate limits don't
      # apply). Pulling explicitly also surfaces pull failures here instead
      # of as a silent instance launch failure inside terraform apply.
      - name: Pre-pull the EC2 guest image
        run: docker pull public.ecr.aws/amazonlinux/amazonlinux:2023

      - name: Build Lambda package
        run: python python/scripts/build-zip.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform (init + apply)
        run: |
          terraform -chdir=python/terraform init
          terraform -chdir=python/terraform apply -auto-approve

      # If provisioning failed, dump what Floci and the child containers saw.
      - name: Diagnostics (Floci + container logs)
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "=== floci logs ==="
          docker logs floci 2>&1 | tail -150
          for c in $(docker ps -aq --filter 'name=floci-'); do
            echo "=== logs: $(docker inspect -f '{{.Name}}' "$c" 2>/dev/null) ==="
            docker logs "$c" 2>&1 | tail -60
          done

      - name: Wait for the EC2 API
        working-directory: python
        run: |
          uv run python - <<'PY'
          import socket
          import time

          from local_aws import floci_boto

          deadline = time.time() + 300
          while time.time() < deadline:
              for res in floci_boto("ec2").describe_instances()["Reservations"]:
                  for i in res["Instances"]:
                      tags = {t["Key"]: t["Value"] for t in i.get("Tags", [])}
                      if tags.get("Name") == "dbos-client" and i["State"]["Name"] == "running":
                          try:
                              socket.create_connection((i["PrivateIpAddress"], 8000), timeout=3)
                              raise SystemExit(0)
                          except OSError:
                              pass
              time.sleep(5)
          raise SystemExit("EC2 API did not come up in 300s")
          PY

      - name: E2E tests (pytest)
        working-directory: python
        run: uv run pytest tests/ -v

      # Tear the Python stack down before Go starts: on a shared Floci the Go
      # job must never find Python resources (on GitHub runners each job has
      # its own Floci anyway).
      - name: Terraform destroy (python stack)
        run: terraform -chdir=python/terraform destroy -auto-approve

  go:
    runs-on: ubuntu-latest
    needs: [python]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: go vet + build
        working-directory: golang
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./...

      # E2E: the Go stack is emulated by Floci too, provisioned from
      # golang/terraform (its own RDS dbos-go-db, Lambda dbos-worker-go and
      # EC2 dbos-client-go — nothing shared with the Python stack).
      - name: Start Floci (AWS emulator)
        run: docker compose up -d

      - name: Wait for Floci
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' floci 2>/dev/null)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Floci did not become healthy in 120s" && exit 1

      - name: Build Lambda package
        working-directory: golang
        run: ./scripts/build-zip.sh

      - name: Pre-pull the EC2 guest image
        run: docker pull public.ecr.aws/amazonlinux/amazonlinux:2023

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform (init + apply)
        run: |
          terraform -chdir=golang/terraform init
          terraform -chdir=golang/terraform apply -auto-approve

      # If provisioning failed, dump what Floci and the child containers saw.
      - name: Diagnostics (Floci + container logs)
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "=== floci logs ==="
          docker logs floci 2>&1 | tail -150
          for c in $(docker ps -aq --filter 'name=floci-'); do
            echo "=== logs: $(docker inspect -f '{{.Name}}' "$c" 2>/dev/null) ==="
            docker logs "$c" 2>&1 | tail -60
          done

      - name: Wait for the EC2 API
        working-directory: golang
        run: go run ./scripts/wait_api.go

      - name: E2E tests (go test)
        working-directory: golang
        run: go test ./tests/ -v -timeout 600s

      # Tear the Go stack down at the end.
      - name: Terraform destroy (go stack)
        run: terraform -chdir=golang/terraform destroy -auto-approve
